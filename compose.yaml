# Castor environments. Variables come from the root .env (copy .env.example).
#   local: docker compose --profile local up -d --wait     (database and Kafka, apps run on the host)
#   dev:   docker compose --profile dev up -d --build --wait   (database, Kafka, backend, frontend in containers)
# Container, network and volume names are fixed per environment so local and dev never collide.
name: castor

services:
  castor-local-db:
    profiles: [local]
    image: postgis/postgis:18-3.6
    container_name: castor-local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-castor}
      POSTGRES_USER: ${POSTGRES_USER:-castor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - castor-local-pgdata:/var/lib/postgresql
      - ./db/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Single-node KRaft broker (one process is broker and controller). The container listens on the same port it
  # advertises, so the health check and the host reach it by the address the broker announces.
  castor-local-kafka:
    profiles: [local]
    image: apache/kafka:4.2.2
    container_name: castor-local-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:${LOCAL_KAFKA_PORT:-9092},CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${LOCAL_KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - castor-local-kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:${LOCAL_KAFKA_PORT:-9092}:${LOCAL_KAFKA_PORT:-9092}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${LOCAL_KAFKA_PORT:-9092} > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  castor-dev-db:
    profiles: [dev]
    image: postgis/postgis:18-3.6
    container_name: castor-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-castor}
      POSTGRES_USER: ${POSTGRES_USER:-castor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - castor-dev-pgdata:/var/lib/postgresql
      - ./db/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    networks: [castor-dev-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # Same broker as local, but nothing is kept: the data directory is tmpfs, so dev Kafka is empty after every container
  # start, like the dev database reset.
  castor-dev-kafka:
    profiles: [dev]
    image: apache/kafka:4.2.2
    container_name: castor-dev-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://castor-dev-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    # mode 1777: the broker runs as a non-root user and tmpfs is root-owned by default
    tmpfs:
      - /var/lib/kafka/data:mode=1777
    networks: [castor-dev-net]
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server castor-dev-kafka:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  castor-dev-backend:
    profiles: [dev]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: castor-dev-backend:local
    container_name: castor-dev-backend
    depends_on:
      castor-dev-db:
        condition: service_healthy
      castor-dev-kafka:
        condition: service_healthy
    environment:
      CASTOR_ENV: dev
      KAFKA_BOOTSTRAP_SERVERS: castor-dev-kafka:9092
      CASTOR_DEMO_LOGIN: "true"
      CASTOR_FEATURE_CONTAINERS: ${CASTOR_FEATURE_CONTAINERS:-true}
      CASTOR_RESET_ON_START: "true"
      CASTOR_PORT_CODE: ${CASTOR_PORT_CODE:-westports}
      CASTOR_ADMIN_USERNAME: ${CASTOR_ADMIN_USERNAME:-admin}
      CASTOR_ADMIN_PASSWORD: ${CASTOR_ADMIN_PASSWORD:?set CASTOR_ADMIN_PASSWORD in .env}
      CASTOR_CORS_ORIGINS: http://localhost:${DEV_WEB_PORT:-8080}
      DB_URL: jdbc:postgresql://castor-dev-db:5432/${POSTGRES_DB:-castor}
      # Local/dev-only role passwords from db/init/01-roles.sql
      DB_USERNAME: castor_app
      DB_PASSWORD: castor_app_dev
      DB_FLYWAY_USERNAME: castor_flyway
      DB_FLYWAY_PASSWORD: castor_flyway_dev
    networks: [castor-dev-net]
    expose: ["8081", "9000"]
    restart: unless-stopped

  castor-dev-frontend:
    profiles: [dev]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        BUILD_TIME: ${BUILD_TIME:-}
        VITE_PORT_CODE: ${CASTOR_PORT_CODE:-westports}
        VITE_DEMO_LOGIN: "true"
        VITE_FEATURE_CONTAINERS: ${CASTOR_FEATURE_CONTAINERS:-true}
        VITE_SATELLITE_TILE_URL: ${VITE_SATELLITE_TILE_URL:-https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/{z}/{y}/{x}.jpg}
    image: castor-dev-frontend:local
    container_name: castor-dev-frontend
    depends_on:
      castor-dev-backend:
        condition: service_healthy
    networks: [castor-dev-net]
    ports:
      - "${DEV_WEB_PORT:-8080}:8080"
    restart: unless-stopped

networks:
  castor-dev-net:
    name: castor-dev-net

volumes:
  castor-local-pgdata:
    name: castor-local-pgdata
  castor-local-kafkadata:
    name: castor-local-kafkadata
  castor-dev-pgdata:
    name: castor-dev-pgdata
