# castor-gateway configuration
# Profiles: dev (developer machine, Dev Services starts PostGIS and Kafka), test (every automated test, inherits dev) and prod.
# prod: every deployed environment, shared dev included; all values come from the environment.
# Required in prod: DB_URL, DB_GATEWAY_USERNAME, DB_GATEWAY_PASSWORD, KAFKA_BOOTSTRAP_SERVERS.
# A missing value stops start-up with a message naming the variable. Start locally with: ./mvnw -pl castor-gateway quarkus:dev

quarkus.application.name=castor-gateway

# --- Environment (every castor.* value is bound by CastorConfig; guards in ConfigGuard) ---
# CASTOR_ENV is local, dev or test. Any other value is a protected environment: reset-on-start, the demo key, CHANGE_ME
# values and fail points stop start-up.
castor.env=${CASTOR_ENV}
%dev.castor.env=${CASTOR_ENV:local}
castor.port-code=${CASTOR_PORT_CODE:westports}
castor.data.reset-on-start=${CASTOR_RESET_ON_START:false}

# local = dev plus the Docker database and broker of docker compose --profile local (application-local.properties)
%local.quarkus.config.profile.parent=dev

# --- HTTP ---
quarkus.http.port=8082
# The endpoint itself refuses bodies over castor.intake.max-body-bytes (256 KB) with Problem Details, after the key check.
# This is only the hard stop of the HTTP layer for bodies that were never meant to be read.
quarkus.http.limits.max-body-size=2M
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# --- Management interface (health, metrics, OpenAPI) ---
quarkus.management.enabled=true
quarkus.management.port=9002
quarkus.smallrye-openapi.info-title=Castor Gateway API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.management.enabled=true

# --- Intake (INGEST-02) ---
# GATEWAY_DEMO_KEY is the API key of every source in local, dev and test (written hashed to ingest.api_key at start).
# Protected environments refuse it (ConfigGuard): their keys are issued with IssueApiKey and shown once.
castor.intake.demo-key=${GATEWAY_DEMO_KEY:}
%dev.castor.intake.demo-key=${GATEWAY_DEMO_KEY:local-gateway-demo-key}
castor.intake.max-body-bytes=262144
castor.intake.max-batch-size=500
castor.intake.max-clock-skew=PT5M

# --- Workers: normalizer, outbox relay, housekeeping ---
castor.workers.enabled=true
castor.normalizer.batch-size=200
castor.normalizer.interval=PT0.5S
castor.relay.batch-size=500
castor.relay.interval=PT0.5S
# How long the broker may take to acknowledge a message before the relay gives up and tries again on its next run
castor.relay.send-timeout=PT10S
castor.retention.outbox=P7D
castor.retention.raw=P7D
castor.retention.quarantine=P30D
castor.retention.interval=PT1H

# --- Database: schema ingest, owned by castor_gateway (db/init/01-roles.sql), which also runs the migrations ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.image-name=postgis/postgis:18-3.6
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_GATEWAY_USERNAME}
%prod.quarkus.datasource.password=${DB_GATEWAY_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=ingest
# Flyway clean is enabled only when castor.data.reset-on-start is true (ConfigGuardStartup)
quarkus.flyway.clean-at-start=${castor.data.reset-on-start}

# --- Kafka ---
# prod: every deployed environment, KAFKA_BOOTSTRAP_SERVERS is required (compose dev: castor-dev-kafka:9092).
# dev and test: while kafka.bootstrap.servers is unset, Dev Services starts one throwaway broker with the same pinned image
# as compose.yaml. The local profile points at the Docker broker (application-local.properties).
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
quarkus.kafka.devservices.provider=upstream-kafka
quarkus.kafka.devservices.image-name=apache/kafka:4.2.2
%test.quarkus.kafka.devservices.shared=false
castor.kafka.replication-factor=${CASTOR_KAFKA_REPLICATION_FACTOR:1}

# --- Logging: plain text in dev, JSON in prod ---
quarkus.log.level=INFO
quarkus.log.category."com.djavafactory.castor".level=INFO
%dev.quarkus.log.category."com.djavafactory.castor".level=DEBUG
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=castor-gateway
%dev.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (req=%X{requestId}) %s%e%n

# --- Metrics (served on the management port at /q/metrics) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# --- Tests: profile "test" inherits dev. Dev Services starts one fresh PostGIS and one Kafka container per test JVM ---
%test.quarkus.config.profile.parent=dev
%test.quarkus.datasource.devservices.reuse=false
# The workers are run by hand in tests (WorkerSupport); IntakePipelineIT switches them on
%test.castor.workers.enabled=false
# HMAC secret of source "canonical" for the signed-webhook tests (IntakeSignatureIT); real secrets come from GATEWAY_HMAC_<REF>
%test.gateway.hmac.canonical=test-hmac-secret
%test.quarkus.log.category."com.djavafactory.castor".level=INFO
quarkus.http.test-port=0
quarkus.management.test-port=0
