server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://tiles.maps.eox.at; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:" always;

    # Management endpoints (health, metrics, openapi) are never reachable through the web port
    location /q/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://castor-dev-backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Hashed build assets never change: cache for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # expires -1 sends Cache-Control: no-cache without replacing the security headers above
    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
