# Local profile: the database runs in Docker (docker compose --profile local up -d --wait), the app on the host.
# Roles and passwords come from db/init/01-roles.sql. Tests use the dev profile and Dev Services, never this file.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${LOCAL_DB_PORT:5432}/${POSTGRES_DB:castor}
quarkus.datasource.username=${DB_USERNAME:castor_app}
quarkus.datasource.password=${DB_PASSWORD:castor_app_dev}
quarkus.flyway.username=${DB_FLYWAY_USERNAME:castor_flyway}
quarkus.flyway.password=${DB_FLYWAY_PASSWORD:castor_flyway_dev}
