# castor-core configuration
# Profiles: local (developer machine), dev-env (shared dev environment), test, prod (placeholder, finished in a later ticket).
# `dev` (quarkus:dev) inherits local. Start locally with: ./mvnw quarkus:dev -Dquarkus.profile=local
# Required environment values outside local/test: DB_URL, DB_USERNAME, DB_PASSWORD, CASTOR_CORS_ORIGINS.
# A missing value stops start-up with a message naming the variable.

quarkus.application.name=castor-core
%dev.quarkus.config.profile.parent=local

# --- Environment (every castor.* value is bound by CastorConfig; guards in ConfigGuard) ---
# CASTOR_ENV is local, dev or test. Any other value is a protected environment: demo login, reset-on-start,
# CHANGE_ME values, short admin passwords and open CORS stop start-up.
castor.env=${CASTOR_ENV}
%local.castor.env=${CASTOR_ENV:local}
%test.castor.env=test
castor.port-code=${CASTOR_PORT_CODE:westports}
castor.demo-login=${CASTOR_DEMO_LOGIN:false}
castor.admin.username=${CASTOR_ADMIN_USERNAME:admin}
castor.admin.password=${CASTOR_ADMIN_PASSWORD}
%local.castor.admin.password=${CASTOR_ADMIN_PASSWORD:local-admin-password}
%test.castor.admin.password=test-admin-password
castor.data.reset-on-start=${CASTOR_RESET_ON_START:false}

# --- HTTP ---
quarkus.http.port=8081
# 10 MB is the largest body any endpoint accepts (GeoJSON import); other endpoints are held to 1 MB in BodyLimitFilter
quarkus.http.limits.max-body-size=10M
%dev-env.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# --- CORS: explicit allow-list, never "*" (checked at start-up by CorsOriginsValidator) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS}
%local.quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS:http://localhost:5173}
%test.quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,If-Match,If-None-Match
quarkus.http.cors.exposed-headers=ETag,Location,X-Request-Id
quarkus.http.cors.access-control-allow-credentials=false

# --- Management interface (health, metrics) ---
quarkus.management.enabled=true
quarkus.management.port=9000

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.image-name=postgis/postgis:18-3.6
%dev-env.quarkus.datasource.jdbc.url=${DB_URL}
%dev-env.quarkus.datasource.username=${DB_USERNAME}
%dev-env.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=ref,layout,audit,security
# Flyway clean is enabled only when castor.data.reset-on-start is true (ConfigGuardStartup)
quarkus.flyway.clean-at-start=${castor.data.reset-on-start}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=100
%local.quarkus.hibernate-orm.log.sql=true
%dev-env.quarkus.hibernate-orm.log.sql=true

# --- OpenAPI and Swagger UI ---
quarkus.smallrye-openapi.info-title=Castor Core API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
# Keep both on the API port, where the ADMIN rule below applies (not moved to the management port)
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.management.enabled=false
quarkus.swagger-ui.always-include=false
%local.quarkus.swagger-ui.always-include=true
%dev-env.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true

# OpenAPI and Swagger UI need the ADMIN role, except in local and dev
quarkus.http.auth.policy.admin-only.roles-allowed=ADMIN
quarkus.http.auth.permission.openapi.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.openapi.policy=admin-only
%local.quarkus.http.auth.permission.openapi.policy=permit
%dev-env.quarkus.http.auth.permission.openapi.policy=permit

# --- Logging: plain text in local and test, JSON elsewhere ---
quarkus.log.level=INFO
quarkus.log.category."it.replica8.castor".level=INFO
%local.quarkus.log.category."it.replica8.castor".level=DEBUG
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=castor-core
%local.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (req=%X{requestId} user=%X{username}) %s%e%n

# --- Metrics (served on the management port at /q/metrics) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# --- Test profile ---
%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0
