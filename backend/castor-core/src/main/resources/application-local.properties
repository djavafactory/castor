# Local profile: the database runs in Docker (docker compose --profile local up -d), the app on the host.
# Values come from the root .env exported to the shell, or fall back to the compose defaults.
# Tests use the test profile and Dev Services, never this file.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${LOCAL_DB_PORT:5432}/${POSTGRES_DB:castor}
quarkus.datasource.username=${DB_USERNAME:castor_app}
quarkus.datasource.password=${DB_PASSWORD}
