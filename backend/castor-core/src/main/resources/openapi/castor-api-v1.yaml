openapi: 3.1.0
info:
  title: Castor API
  version: 1.0.0
# Placeholder snapshot created by SETUP-05 so the frontend type generation has an input.
# Replace with the snapshot generated from the backend code (/q/openapi) once the contract test exists.
paths:
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in user
      security: [{basicAuth: []}]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Missing or wrong credentials
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Version of the running build (no login needed)
      security: []
      responses:
        '200':
          description: The build stamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
  /api/v1/auth/demo-users:
    get:
      operationId: listDemoUsers
      summary: Demo users for the login page (local and dev with demo login on)
      security: []
      responses:
        '200':
          description: The demo users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoUser'
        '404':
          description: Demo login is off
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Records that the user signed out
      security: [{basicAuth: []}]
      responses:
        '204':
          description: Recorded
  /api/v1/ports/{portCode}:
    get:
      operationId: getPort
      summary: A port with its quay frame and measurement CRS
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
      responses:
        '200':
          description: The port record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Port'
        '404':
          description: Unknown port
  /api/v1/ports/{portCode}/reference-features:
    get:
      operationId: listReferenceFeatures
      summary: Read-only OpenStreetMap features of a port as GeoJSON (there is no write endpoint)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
        - name: kind
          in: query
          required: false
          description: Comma separated kinds, for example BUILDING,ROAD; all kinds when absent
          schema:
            type: string
        - name: bbox
          in: query
          required: false
          description: minLon,minLat,maxLon,maxLat (WGS84)
          schema:
            type: string
      responses:
        '200':
          description: The features, ordered by OpenStreetMap reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceFeatureCollection'
        '404':
          description: Unknown port
        '400':
          description: Unknown kind or malformed bbox
  /api/v1/ports/{portCode}/search:
    get:
      operationId: searchPlaces
      summary: Finds the port, control points, layout assets and map shapes by name or code (own data only)
      description: Case-insensitive substring of name and code, at most 12 results. Nothing typed is stored, logged as data or sent to a third party; the answer is never cached.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
        - name: q
          in: query
          required: true
          description: At least 2 characters
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: layoutId
          in: query
          required: false
          description: The layout version whose assets are searched (the draft in Design); the published version when absent. Drafts are for editors and above.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The places, best match first
          content:
            application/json:
              schema:
                type: array
                maxItems: 12
                items:
                  $ref: '#/components/schemas/PlaceHit'
        '400':
          description: q is shorter than 2 characters
        '404':
          description: Unknown port, or a layout version that does not exist for this caller
  /api/v1/ports/{portCode}/layouts/current:
    get:
      operationId: getCurrentLayout
      summary: The published layout version of a port as GeoJSON
      description: ETag is the version id with the row versions of the version and its revisions; If-None-Match gives 304.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
      responses:
        '200':
          description: The published version and one feature per asset
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '304':
          description: Unchanged since the ETag in If-None-Match
        '404':
          description: Unknown port, or the port has no published layout
  /api/v1/ports/{portCode}/layouts/draft:
    get:
      operationId: getDraftLayout
      summary: The open draft of a port (EDITOR and above)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
      responses:
        '200':
          description: The draft and one feature per asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '304':
          description: Unchanged since the ETag in If-None-Match
        '403':
          description: The role is below EDITOR
        '404':
          description: Unknown port, or there is no draft
  /api/v1/ports/{portCode}/layouts:
    get:
      operationId: listLayoutVersions
      summary: The versions of a port, newest first
      description: Drafts and discarded versions are listed for EDITOR and above only; a viewer sees published and superseded versions.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, SUPERSEDED, DISCARDED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: The versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LayoutVersionSummary'
        '400':
          description: Unknown status or limit out of range
    post:
      operationId: createDraftLayout
      summary: Start the draft of a port (EDITOR and above)
      description: Version number is the highest plus one. Revisions and details are copied unless basedOn is "blank". Writes a DRAFT_CREATED audit row.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basedOn]
              properties:
                basedOn:
                  type: string
                  description: '"published", "blank" or the id of a published or superseded version of the port'
      responses:
        '201':
          description: The new draft and one feature per asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '400':
          description: basedOn missing or not understood
        '403':
          description: The role is below EDITOR
        '404':
          description: Unknown port or version, or no published layout to copy
        '409':
          description: A draft already exists; draftId in the body is its id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/ports/{portCode}/audit:
    get:
      operationId: listAudit
      summary: The audit trail of a port, newest first (ADMIN)
      description: Keyset pagination. Pass nextBefore of the last page as before to get the next one.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/PortCode'
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: actor, in: query, schema: {type: string}}
        - name: action
          in: query
          schema:
            type: string
            enum: [ASSET_CREATED, ASSET_UPDATED, ASSET_DELETED, DRAFT_CREATED, DRAFT_DISCARDED, LAYOUT_PUBLISHED, LAYOUT_RESTORED, LAYOUT_IMPORTED, OVERRIDE_RECORDED]
        - {name: assetId, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: before, in: query, schema: {type: integer, format: int64}}
      responses:
        '200':
          description: One page of audit rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, at, actor, action, entityKind]
                      properties:
                        id: {type: integer, format: int64}
                        at: {type: string, format: date-time}
                        actor: {type: string}
                        action: {type: string}
                        entityKind: {type: string}
                        entityId: {type: [string, 'null']}
                        layoutVersionId: {type: [string, 'null'], format: uuid}
                        before: {type: [object, 'null'], description: Snapshot before the change}
                        after: {type: [object, 'null'], description: Snapshot after the change}
                        requestId: {type: [string, 'null']}
                  nextBefore:
                    type: [integer, 'null']
                    format: int64
        '400':
          description: Malformed from, to, action or limit
        '403':
          description: The role is not ADMIN
        '404':
          description: Unknown port
  /api/v1/layouts/{layoutId}:
    delete:
      operationId: discardDraftLayout
      summary: Discard a draft (PUBLISHER and above)
      description: The version becomes DISCARDED and its rows stay for the audit trail. Writes a DRAFT_DISCARDED audit row.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '204':
          description: Discarded
        '403':
          description: The role is below PUBLISHER
        '404':
          description: Unknown version
        '409':
          description: The version is not a draft
    get:
      operationId: getLayout
      summary: Any layout version as GeoJSON (drafts and discarded versions need EDITOR)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: The version and one feature per asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '304':
          description: Unchanged since the ETag in If-None-Match
        '404':
          description: Unknown version, or a version the role may not see
  /api/v1/layouts/{layoutId}/assets/{assetId}:
    get:
      operationId: getLayoutAsset
      summary: One asset of one version; the ETag is its row version
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The feature
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutFeature'
        '304':
          description: Unchanged since the ETag in If-None-Match
        '404':
          description: Unknown version or asset
    patch:
      operationId: updateLayoutAsset
      summary: Update one asset of a draft with optimistic concurrency (EDITOR)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: The row version (ETag) of the asset revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                code:
                  type: string
                name:
                  type: string
                geometry:
                  $ref: '#/components/schemas/GeoJsonGeometry'
                anchor:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                headingDeg:
                  type: number
                lengthM:
                  type: number
                widthM:
                  type: number
                heightM:
                  type: number
                radiusM:
                  type: number
                lineWidthM:
                  type: number
                storageZoneCode:
                  type: string
                details:
                  $ref: '#/components/schemas/LayoutDetails'
                links:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayoutLink'
                provenance:
                  $ref: '#/components/schemas/LayoutProvenance'
                override:
                  type: object
                  properties:
                    reason:
                      type: string
      responses:
        '200':
          description: The updated feature, new ETag and warnings
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    $ref: '#/components/schemas/LayoutFeature'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationIssue'
                  adjustmentMm:
                    type: number
        '409':
          description: Stale If-Match or version is not a draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Missing If-Match header
        '422':
          description: Validation errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown version or asset
    delete:
      operationId: deleteLayoutAsset
      summary: Delete the revision of one asset in a draft (identity kept) (EDITOR)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: The row version (ETag) of the asset revision
      responses:
        '204':
          description: Revision removed
          headers:
            X-Castor-Dependents:
              schema:
                type: string
              description: What was affected (for example links removed)
        '409':
          description: Stale If-Match or version is not a draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Missing If-Match header
        '404':
          description: Unknown version or asset
  /api/v1/layouts/{layoutId}/assets:
    post:
      operationId: createLayoutAsset
      summary: Create one asset in a draft (EDITOR)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type:
                  type: string
                  description: The asset type code
                code:
                  type: string
                  description: The asset code; assigned from the type prefix if missing'
                name:
                  type: string
                geometry:
                  $ref: '#/components/schemas/GeoJsonGeometry'
                anchor:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                headingDeg:
                  type: number
                lengthM:
                  type: number
                widthM:
                  type: number
                heightM:
                  type: number
                radiusM:
                  type: number
                lineWidthM:
                  type: number
                storageZoneCode:
                  type: string
                details:
                  $ref: '#/components/schemas/LayoutDetails'
                links:
                  type: array
                  items:
                    $ref: '#/components/schemas/LayoutLink'
                provenance:
                  $ref: '#/components/schemas/LayoutProvenance'
      responses:
        '201':
          description: The created feature, Location, ETag and warnings
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    $ref: '#/components/schemas/LayoutFeature'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationIssue'
                  adjustmentMm:
                    type: number
        '409':
          description: Version is not a draft
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Validation errors
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown version
  /api/v1/layouts/{layoutId}/assets/{assetId}/duplicate:
    post:
      operationId: duplicateLayoutAsset
      summary: Duplicate one asset of a draft, offset +20 m in local x and y (EDITOR)
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: The duplicated feature, Location, ETag and warnings
          headers:
            Location:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  feature:
                    $ref: '#/components/schemas/LayoutFeature'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationIssue'
        '409':
          description: Version is not a draft
        '404':
          description: Unknown version or asset
  /api/v1/layouts/{layoutId}/publish:
    post:
      operationId: publishLayout
      summary: Publish a draft (PUBLISHER and above)
      description: 'Runs the whole rule catalogue first; any error answers 422 "Publishing blocked: N error(s). Fix them first." with the issues and changes nothing. Otherwise, in one transaction, the draft becomes PUBLISHED, the previous published version SUPERSEDED, and a LAYOUT_PUBLISHED audit row is written.'
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResponse'
        '400':
          description: The note is longer than 500 characters
        '403':
          description: The role is below PUBLISHER
        '404':
          description: Unknown version
        '409':
          description: The version is not a draft
        '422':
          description: Publishing blocked by errors of the rule catalogue, or the reviewer is not a publisher or admin other than the caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/layouts/{layoutId}/restore:
    post:
      operationId: restoreLayout
      summary: Load an older version into a new draft (PUBLISHER and above)
      description: The draft is a copy of the version with the same asset ids. An open draft is a 409 unless discardDraft is true. Writes a LAYOUT_RESTORED audit row.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                discardDraft:
                  type: boolean
      responses:
        '201':
          description: The new draft and one feature per asset, with a message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutResponse'
        '400':
          description: The version is not published or superseded
        '403':
          description: The role is below PUBLISHER
        '404':
          description: Unknown version
        '409':
          description: A draft is open; draftId in the body is its id
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/layouts/{layoutId}/diff:
    get:
      operationId: diffLayout
      summary: What differs between two versions
      description: Added are in this version but not in the other, removed the other way round. Without against the published version is the other side.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: against
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The difference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '400':
          description: against is not a version id, or the versions belong to different ports
        '404':
          description: Unknown version, or a version the role may not see
  /api/v1/assets/{assetId}/history:
    get:
      operationId: getAssetHistory
      summary: One asset in every version that holds it, newest first
      security: [{basicAuth: []}]
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One entry per version
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetHistoryEntry'
        '404':
          description: Unknown asset
  /api/v1/reviewers:
    get:
      operationId: listReviewers
      summary: Who may be named as reviewer when publishing (PUBLISHER and above)
      description: Publishers and admins, the caller left out.
      security: [{basicAuth: []}]
      responses:
        '200':
          description: The users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [username, displayName]
                  properties:
                    username:
                      type: string
                    displayName:
                      type: string
        '403':
          description: The role is below PUBLISHER
  /api/v1/layouts/{layoutId}/validate:
    post:
      operationId: validateLayout
      summary: Every error and warning of a version (EDITOR and above)
      description: Runs the whole rule catalogue over the version (README section 6). Read-only, writes no audit row. Errors block publishing, warnings do not.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: The issues, errors first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '403':
          description: The role is below EDITOR
        '404':
          description: Unknown version
  /api/v1/layouts/{layoutId}/accuracy-report:
    get:
      operationId: getAccuracyReport
      summary: Control point residuals and shape counts by accuracy class (VIEWER and above)
      description: How well the stored coordinates match the port's control points (measured in its metric CRS) and how much of the layout is only approximate. Read-only.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: The accuracy report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccuracyReportResponse'
        '404':
          description: Unknown version, or no version visible to the caller
  /api/v1/layouts/{layoutId}/export:
    get:
      operationId: exportLayout
      summary: A version as a GeoJSON file with its provenance (VIEWER and above; drafts for editors)
      description: A FeatureCollection in CRS84 [lon, lat] with 7 decimals. The castor member holds the port frame and the version. Features from a source that may not be stored (Google Maps) are left out. The file name is in Content-Disposition as castor-<port>-v<N>-<yyyy-mm-dd>.geojson.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
      responses:
        '200':
          description: The GeoJSON file
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Castor-Feature-Count:
              description: Number of features in the file
              schema:
                type: integer
          content:
            application/geo+json:
              schema:
                type: object
        '404':
          description: Unknown version, or no version visible to the caller
  /api/v1/layouts/{layoutId}/import:
    post:
      operationId: importLayout
      summary: Add or update the assets of a GeoJSON file in the draft (EDITOR and above)
      description: A FeatureCollection or a single Feature in a .geojson or .json file of at most 10 MB. Each feature is checked with the layout rules against the draft and the features accepted earlier in the file; failures are skipped and listed. With dryRun=true (the default) nothing is stored. With dryRun=false everything accepted is stored in one transaction with one LAYOUT_IMPORTED audit row plus one row per asset.
      security: [{basicAuth: []}]
      parameters:
        - $ref: '#/components/parameters/LayoutId'
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: What was or would be imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReportResponse'
        '400':
          description: Not a .geojson or .json file, not valid JSON, or not a Feature or FeatureCollection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown version
        '409':
          description: The version is not a draft
components:
  parameters:
    LayoutId:
      name: layoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PortCode:
      name: portCode
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    LayoutVersionSummary:
      type: object
      required: [id, versionNo, status, createdBy, createdAt, assetCount]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, SUPERSEDED, DISCARDED]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        publishedBy:
          type: string
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        reviewedBy:
          type: string
          nullable: true
        restoredFromVersionNo:
          type: integer
          nullable: true
          description: Set when the version was made by restoring an older one
        note:
          type: string
          nullable: true
        assetCount:
          type: integer
    PublishRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
        reviewedBy:
          type: string
          description: Username of a publisher or admin other than the caller
          nullable: true
    PublishResponse:
      type: object
      required: [versionNo, publishedAt, publishedBy, assetCount]
      properties:
        versionNo:
          type: integer
        publishedAt:
          type: string
          format: date-time
        publishedBy:
          type: string
        reviewedBy:
          type: string
          nullable: true
        assetCount:
          type: integer
    DiffResponse:
      type: object
      required: [added, removed, changed]
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/DiffItem'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/DiffItem'
        changed:
          type: array
          items:
            type: object
            required: [assetId, code, name, fields]
            properties:
              assetId:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
              fields:
                type: array
                items:
                  type: string
                description: Names of the properties that differ, for example geometry or heightM
    DiffItem:
      type: object
      required: [assetId, code, name, type]
      properties:
        assetId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
    AssetHistoryEntry:
      type: object
      required: [versionId, versionNo, status, name, geometry, changedBy, changedAt]
      properties:
        versionId:
          type: string
          format: uuid
        versionNo:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, SUPERSEDED, DISCARDED]
        name:
          type: string
        geometry:
          type: string
          description: Short summary of the shape, for example "Polygon, 1,234 m2"
        changedBy:
          type: string
        changedAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [username, roles, displayName]
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        displayName:
          type: string
    Version:
      type: object
      required: [version, commit, buildTime, environment]
      properties:
        version:
          type: string
          description: X.Y.Z for a release build, otherwise X.Y.Z-dev+commit
        commit:
          type: string
          description: Short git commit (7 characters), or unknown
        buildTime:
          type: string
          format: date-time
          description: UTC
        environment:
          type: string
    DemoUser:
      type: object
      required: [username, label]
      properties:
        username:
          type: string
        label:
          type: string
    LonLat:
      type: object
      required: [lon, lat]
      properties:
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
    Port:
      type: object
      required: [code, name, city, timeZone, utcOffset, origin, measureSrid, frameRotDeg, extent, synthetic, berthCount, attribution, dataSources]
      properties:
        code:
          type: string
        name:
          type: string
        city:
          type: string
        timeZone:
          type: string
          description: IANA time zone name, for example Asia/Kuala_Lumpur
        utcOffset:
          type: string
          description: UTC offset derived from the time zone, never stored, for example +08:00
        origin:
          $ref: '#/components/schemas/LonLat'
        measureSrid:
          type: integer
          format: int32
        frameRotDeg:
          type: number
          format: double
          description: Angle of local +X, degrees counter-clockwise from east
        extent:
          $ref: '#/components/schemas/GeoJsonGeometry'
        landExtent:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonGeometry'
            - type: 'null'
        quayLine:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonGeometry'
            - type: 'null'
        synthetic:
          type: boolean
        publishedLayoutVersionId:
          type: [string, 'null']
          format: uuid
        berthCount:
          type: integer
          format: int32
          description: Berths in the published layout, derived, never typed in
        attribution:
          type: string
        dataSources:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
    DataSource:
      type: object
      required: [code, name, licence, mayTrace, mayPersist]
      properties:
        code:
          type: string
        name:
          type: string
        licence:
          type: string
        mayTrace:
          type: boolean
        mayPersist:
          type: boolean
    GeoJsonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
        coordinates:
          type: array
          items: {}
    ReferenceFeatureKind:
      type: string
      enum: [BUILDING, ROAD, RAIL, COASTLINE, JETTY, WATER, LANDUSE]
    ReferenceFeatureProperties:
      type: object
      required: [kind, osm_ref, source, accuracy]
      properties:
        kind:
          $ref: '#/components/schemas/ReferenceFeatureKind'
        osm_ref:
          type: string
          description: OpenStreetMap reference such as way/1300405460
        name:
          type: [string, 'null']
          description: The mapped name; null when OpenStreetMap has none
        height_m:
          type: [number, 'null']
          format: double
        width_m:
          type: [number, 'null']
          format: double
        area_m2:
          type: [number, 'null']
          format: double
          description: Footprint area measured in the port measurement CRS; null for lines
        source:
          type: string
        accuracy:
          type: string
          enum: [SURVEYED, VERIFIED, OPERATOR, APPROXIMATE]
    ReferenceFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          type: object
          description: GeoJSON geometry in WGS84
          required: [type, coordinates]
          properties:
            type:
              type: string
            coordinates:
              type: array
              items: {}
        properties:
          $ref: '#/components/schemas/ReferenceFeatureProperties'
    ReferenceFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceFeature'
    LayoutStatus:
      type: string
      enum: [DRAFT, PUBLISHED, SUPERSEDED, DISCARDED]
    LayoutHeader:
      type: object
      required: [id, versionNo, status]
      properties:
        id:
          type: string
          format: uuid
        versionNo:
          type: integer
        status:
          $ref: '#/components/schemas/LayoutStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        publishedBy:
          type: [string, 'null']
        note:
          type: [string, 'null']
        basedOnVersionNo:
          type: [integer, 'null']
          description: The version this one was copied from; null for a blank draft.
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          description: Who last changed an asset of the version (its creator while nothing changed).
        updatedAt:
          type: string
          format: date-time
          description: When an asset of the version last changed.
    LayoutLink:
      type: object
      required: [kind, toAssetId]
      properties:
        kind:
          type: string
          enum: [SERVES, FEEDS, BELONGS_TO, CONNECTS_TO]
        toAssetId:
          type: string
          format: uuid
    LayoutProvenance:
      type: object
      required: [source, accuracy]
      properties:
        source:
          type: string
        accuracy:
          type: string
        capturedOn:
          type: [string, 'null']
          format: date
        note:
          type: [string, 'null']
    LayoutOverride:
      type: object
      required: [reason, by, at]
      properties:
        reason:
          type: string
        by:
          type: string
        at:
          type: string
          format: date-time
    LayoutComputed:
      type: object
      description: Measured on the port measurement CRS, never stored. Polygons have area and perimeter, lines a length.
      properties:
        areaM2:
          type: [number, 'null']
        perimeterM:
          type: [number, 'null']
        lengthM:
          type: [number, 'null']
        local:
          type: object
          description: Anchor in the quay frame, metres
          properties:
            x:
              type: number
            y:
              type: number
        chainage:
          type: object
          description: Berths only, local x of the start and end of the segment
          properties:
            startM:
              type: number
            endM:
              type: number
    LayoutDetails:
      type: object
      description: Typed details; a group is present only when the asset type has it. Stock is never part of it in Phase 1. Numbers are in the unit named by the field; a null number is an unknown value.
      properties:
        berth:
          type: object
          required: [depthM, maxLoaM, cargoFamilies]
          properties:
            depthM:
              type: number
              description: Maximum draft in metres
            maxLoaM:
              type: [number, 'null']
              description: Maximum length overall in metres; the berth length when null
            cargoFamilies:
              type: array
              items: {type: string}
        crane:
          type: object
          required: [gaugeM, outreachM, backreachM, reachM, safeWorkingLoadT]
          properties:
            gaugeM: {type: [number, 'null']}
            outreachM: {type: [number, 'null']}
            backreachM: {type: [number, 'null']}
            reachM: {type: [number, 'null']}
            safeWorkingLoadT: {type: [number, 'null']}
        storage:
          type: object
          required: [capacityValue, capacityUnit, usableRatio, usableCapacity, designFill, cargoTypeCode, allowedCargoTypes, maxFloorLoadTM2, maxStackM, bearingCapacityKpa, weatherExposed]
          properties:
            capacityValue: {type: number}
            capacityUnit:
              type: string
              enum: ['t', 'm3', 'pcs', 'veh', 'TEU', 'trucks']
            usableRatio:
              type: number
              description: Between 0 and 1, exclusive of 0
            usableCapacity:
              type: number
              description: Computed, capacityValue x usableRatio
            designFill:
              type: number
              description: Between 0 and 1
            cargoTypeCode: {type: [string, 'null']}
            allowedCargoTypes:
              type: array
              items: {type: string}
            maxFloorLoadTM2:
              type: [number, 'null']
              description: Tonnes per square metre
            maxStackM: {type: [number, 'null']}
            bearingCapacityKpa: {type: [number, 'null']}
            weatherExposed:
              type: boolean
              description: true for open storage, false when covered
        storagePad:
          type: object
          required: [bays, rows, bayPitchM, rowPitchM, maxHeightM, capacityT]
          properties:
            bays:
              type: integer
              minimum: 1
            rows:
              type: integer
              minimum: 1
            bayPitchM:
              type: number
              minimum: 5
            rowPitchM:
              type: number
              minimum: 5
            maxHeightM:
              type: number
              minimum: 1
            capacityT:
              type: [number, 'null']
              description: Read-only, computed from the cargo of the pad; null when no cargo is set
        containerYard:
          type: object
          required: [maxTiers, designFill, capacityTeu]
          properties:
            maxTiers:
              type: integer
              minimum: 1
              maximum: 9
            designFill:
              type: number
              description: Between 0 and 1
            capacityTeu:
              type: integer
              minimum: 0
        warehouse:
          type: object
          required: [roofRiseM, dockDoors, doorSide]
          properties:
            roofRiseM:
              type: number
              minimum: 0
            dockDoors:
              type: integer
              minimum: 0
            doorSide:
              type: string
              enum: [NORTH, EAST, SOUTH, WEST]
              description: The side the dock doors face, true compass and not rotated with the asset
        flow:
          type: object
          required: [rateValue, rateUnit]
          properties:
            rateValue:
              type: number
              description: Greater than 0
            rateUnit:
              type: string
              enum: ['t/h', 'm3/h']
        surface:
          type: object
          required: [surfaceCode]
          properties:
            surfaceCode: {type: string}
        zone:
          type: object
          required: [allowedTypes]
          properties:
            allowedTypes:
              type: array
              items: {type: string}
        mobile:
          type: object
          required: [positionMode, uncertaintyM]
          properties:
            positionMode:
              type: string
              enum: [FIXED, PARKED]
            uncertaintyM:
              type: number
              minimum: 0
        equipment:
          type: object
          required: [model, operator, ratedThroughput, throughputUnit, designStatus]
          properties:
            model: {type: [string, 'null']}
            operator: {type: [string, 'null']}
            ratedThroughput: {type: [number, 'null']}
            throughputUnit:
              type: [string, 'null']
              enum: ['t/h', 'lifts/h', 'm3/h', 'veh/h', null]
            designStatus:
              type: string
              enum: [ACTIVE, IDLE, OFFLINE, MAINTENANCE]
    LayoutFeatureProperties:
      type: object
      required: [code, type, name, anchor, details, links, provenance, computed, rowVersion]
      properties:
        code:
          type: string
        type:
          type: string
        name:
          type: string
        anchor:
          type: array
          description: '[lon, lat]'
          items:
            type: number
          minItems: 2
          maxItems: 2
        headingDeg: {type: [number, 'null']}
        lengthM: {type: [number, 'null']}
        widthM: {type: [number, 'null']}
        heightM: {type: [number, 'null']}
        radiusM: {type: [number, 'null']}
        lineWidthM: {type: [number, 'null']}
        elevationM: {type: [number, 'null']}
        clearanceM: {type: [number, 'null']}
        modelRev: {type: [integer, 'null'], description: Revision of the 3D model template the asset was placed with}
        storageZoneCode: {type: [string, 'null']}
        operatorName: {type: [string, 'null'], description: Operator of the asset as entered in the inspector}
        description: {type: [string, 'null']}
        details:
          $ref: '#/components/schemas/LayoutDetails'
        links:
          type: array
          items:
            $ref: '#/components/schemas/LayoutLink'
        provenance:
          $ref: '#/components/schemas/LayoutProvenance'
        override:
          oneOf:
            - $ref: '#/components/schemas/LayoutOverride'
            - type: 'null'
        computed:
          $ref: '#/components/schemas/LayoutComputed'
        rowVersion:
          type: integer
          format: int64
    LayoutFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
          format: uuid
          description: The permanent asset id
        geometry:
          $ref: '#/components/schemas/GeoJsonGeometry'
        properties:
          $ref: '#/components/schemas/LayoutFeatureProperties'
    LayoutFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: '#/components/schemas/LayoutFeature'
    LayoutResponse:
      type: object
      required: [layout, features]
      properties:
        layout:
          $ref: '#/components/schemas/LayoutHeader'
        features:
          $ref: '#/components/schemas/LayoutFeatureCollection'
    PlaceKind:
      type: string
      enum: [PORT, CONTROL_POINT, ASSET, REFERENCE]
    PlaceHit:
      type: object
      required: [kind, id, label, sublabel, lon, lat, bbox]
      properties:
        kind:
          $ref: '#/components/schemas/PlaceKind'
        id:
          type: string
          description: Port code, control point code, asset id or OpenStreetMap reference, by kind
        label:
          type: string
        sublabel:
          type: string
          description: The type of the thing, for example "Berth"
        lon:
          type: number
          format: double
        lat:
          type: number
          format: double
        bbox:
          type: array
          description: minLon, minLat, maxLon, maxLat of the shape; a point has a box of no size
          minItems: 4
          maxItems: 4
          items:
            type: number
            format: double
    ValidationLevel:
      type: string
      enum: [ERROR, WARNING]
    ValidationIssue:
      type: object
      required: [code, level, message, assetIds]
      properties:
        code:
          type: string
          description: Rule code of the catalogue, for example OVERLAP
        level:
          $ref: '#/components/schemas/ValidationLevel'
        message:
          type: string
        assetIds:
          type: array
          description: The assets the issue is about; the first one is the one to select
          items:
            type: string
            format: uuid
    ValidationResponse:
      type: object
      required: [errors, warnings, issues]
      properties:
        errors:
          type: integer
        warnings:
          type: integer
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ControlPointAccuracy:
      type: object
      required: [code, name, roundTripMm]
      properties:
        code:
          type: string
        name:
          type: string
        residualM:
          type: number
          nullable: true
          description: Distance between the expected local position and the stored point, in the port's metric CRS
        roundTripMm:
          type: number
          description: Projection round trip of the stored point, in millimetres
    ImportReportResponse:
      type: object
      required: [file, added, updated, skipped, skipReasons, roundTrip]
      properties:
        file:
          type: string
        added:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        skipReasons:
          type: array
          description: One line per skipped feature, all of them
          items:
            type: string
        roundTrip:
          type: object
          required: [coordinates, maxDifferenceMm]
          properties:
            coordinates:
              type: integer
              description: Coordinates of accepted features that were compared
            maxDifferenceMm:
              type: number
              description: Largest difference between a coordinate of the file and the stored one, in millimetres
    AccuracyReportResponse:
      type: object
      required: [ranAt, controlPoints, maxResidualM, maxRoundTripMm, countsByAccuracy, approximateCount, note]
      properties:
        ranAt:
          type: string
          format: date-time
        controlPoints:
          type: array
          items:
            $ref: '#/components/schemas/ControlPointAccuracy'
        maxResidualM:
          type: number
        maxRoundTripMm:
          type: number
        countsByAccuracy:
          type: object
          additionalProperties:
            type: integer
          properties:
            SURVEYED:
              type: integer
            VERIFIED:
              type: integer
            OPERATOR:
              type: integer
            APPROXIMATE:
              type: integer
        approximateCount:
          type: integer
        note:
          type: string
    Role:
      type: string
      enum: [VIEWER, EDITOR, PUBLISHER, ADMIN]
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errorId:
          type: string
        draftId:
          type: string
          format: uuid
          description: On 409 "A draft already exists", the id of that draft.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
    ProblemError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        pointer:
          type: string
        assetId:
          type: string
          format: uuid
        message:
          type: string
