# castor-core configuration
# Profiles: dev (developer machine, Dev Services starts PostGIS), test (every automated test, inherits dev) and prod.
# prod: every deployed environment, shared dev included; all values come from the environment.
# Required in prod: DB_URL, DB_USERNAME, DB_PASSWORD, DB_FLYWAY_USERNAME, DB_FLYWAY_PASSWORD, CASTOR_CORS_ORIGINS.
# A missing value stops start-up with a message naming the variable. Start locally with: ./mvnw quarkus:dev

quarkus.application.name=castor-core

# --- Environment (every castor.* value is bound by CastorConfig; guards in ConfigGuard) ---
# CASTOR_ENV is local, dev or test. Any other value is a protected environment: demo login, reset-on-start,
# CHANGE_ME values, short admin passwords and open CORS stop start-up.
castor.env=${CASTOR_ENV}
%dev.castor.env=${CASTOR_ENV:local}
castor.port-code=${CASTOR_PORT_CODE:westports}
castor.demo-login=${CASTOR_DEMO_LOGIN:false}
castor.features.containers=${CASTOR_FEATURE_CONTAINERS:true}
castor.admin.username=${CASTOR_ADMIN_USERNAME:admin}
castor.admin.password=${CASTOR_ADMIN_PASSWORD}
%dev.castor.admin.password=${CASTOR_ADMIN_PASSWORD:local-admin-password}
castor.data.reset-on-start=${CASTOR_RESET_ON_START:false}

# local = dev plus the Docker database of docker compose --profile local (application-local.properties)
%local.quarkus.config.profile.parent=dev

# --- HTTP ---
quarkus.http.port=8081
# 10 MB is the largest body any endpoint accepts (GeoJSON import); other endpoints are held to 1 MB in BodyLimitFilter
quarkus.http.limits.max-body-size=10M
%prod.quarkus.http.proxy.proxy-address-forwarding=true
# Reference data (GeoJSON background, catalogues) is large and repetitive: gzip it
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,application/geo+json,application/problem+json

# --- Reference data (CORE-02) ---
# Loads seed/<port>/osm-reference.geojson into ref.reference_feature at start (idempotent, skipped when unchanged)
castor.reference.import-on-start=${CASTOR_REFERENCE_IMPORT_ON_START:true}

# --- Layout (CORE-04) ---
# Loads seed/<port>/layout-v1.geojson as published version 1 when the port has no layout version (local, dev, test only)
castor.layout.seed-on-start=${CASTOR_LAYOUT_SEED_ON_START:true}

# --- CORS: explicit allow-list, never "*" (checked at start-up by CorsOriginsValidator) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS}
%dev.quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,If-Match,If-None-Match
quarkus.http.cors.exposed-headers=ETag,Location,X-Request-Id,Content-Disposition
quarkus.http.cors.access-control-allow-credentials=false

# --- Authentication: HTTP Basic against security.user_account (DatabaseIdentityProvider) ---
# Plain HTTP is for localhost only; every hosted environment must serve the API over HTTPS.
# Every /api path needs a signed-in user except the version, and the demo-user list the login page reads first
# (it answers 404 unless demo login is on). Business code checks roles with @RolesAllowed only.
quarkus.http.auth.basic=true
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.public-api.paths=/api/v1/version,/api/v1/auth/demo-users
quarkus.http.auth.permission.public-api.policy=permit
castor.security.lockout.max-failures=${CASTOR_LOCKOUT_MAX_FAILURES:5}
castor.security.lockout.window=${CASTOR_LOCKOUT_WINDOW:PT15M}
# Longest accepted value is 60 s; PT0S turns the cache off
castor.security.auth-cache-ttl=PT60S

# --- Management interface (health, metrics) ---
quarkus.management.enabled=true
quarkus.management.port=9000

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.image-name=postgis/postgis:18-3.6
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Migrations run as castor_flyway, the service as castor_app (db/init/01-roles.sql, docs/2-database-baseline.md).
# dev uses the Dev Services superuser for both.
%prod.quarkus.flyway.username=${DB_FLYWAY_USERNAME}
%prod.quarkus.flyway.password=${DB_FLYWAY_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=ref,layout,audit,security,ops
# V10 (ops) arrives after V11 on databases that already ran the gateway view; a missed version still applies
quarkus.flyway.out-of-order=true
# Flyway clean is enabled only when castor.data.reset-on-start is true (ConfigGuardStartup)
quarkus.flyway.clean-at-start=${castor.data.reset-on-start}

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=100
%dev.quarkus.hibernate-orm.log.sql=true

# --- Kafka (INGEST-01) ---
# prod: every deployed environment, KAFKA_BOOTSTRAP_SERVERS is required (compose dev: castor-dev-kafka:9092).
# dev and test: while kafka.bootstrap.servers is unset, Dev Services starts one throwaway broker with the same pinned image
# as compose.yaml. The local profile points at the Docker broker (application-local.properties).
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
quarkus.kafka.devservices.provider=upstream-kafka
quarkus.kafka.devservices.image-name=apache/kafka:4.2.2
# Tests never join a broker another run started
%test.quarkus.kafka.devservices.shared=false
# Readiness includes Kafka (KafkaReadinessCheck); castor.kafka.health-timeout (default PT3S) bounds how long it waits for the broker
castor.kafka.replication-factor=${CASTOR_KAFKA_REPLICATION_FACTOR:1}

# --- Integrations (INGEST-04) ---
# Core calls the gateway's internal admin API (/internal/v1) with the service token; browsers only ever call core (R7).
# Compose dev sets GATEWAY_URL to http://castor-dev-gateway:8082. Protected environments must set the token.
castor.gateway.url=${GATEWAY_URL:http://localhost:8082}
castor.gateway.service-token=${CASTOR_SERVICE_TOKEN:}
%dev.castor.gateway.service-token=${CASTOR_SERVICE_TOKEN:local-service-token}
castor.gateway.timeout=PT10S

# --- OpenAPI and Swagger UI ---
quarkus.smallrye-openapi.info-title=Castor Core API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
# Keep both on the API port, where the ADMIN rule below applies (not moved to the management port)
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.management.enabled=false
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true

# OpenAPI and Swagger UI need the ADMIN role, except in dev
quarkus.http.auth.policy.admin-only.roles-allowed=ADMIN
quarkus.http.auth.permission.openapi.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.openapi.policy=admin-only
%dev.quarkus.http.auth.permission.openapi.policy=permit

# --- Logging: plain text in dev, JSON in prod ---
quarkus.log.level=INFO
quarkus.log.category."com.djavafactory.castor".level=INFO
%dev.quarkus.log.category."com.djavafactory.castor".level=DEBUG
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=castor-core
%dev.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (req=%X{requestId} user=%X{username}) %s%e%n

# --- Metrics (served on the management port at /q/metrics) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# --- Tests: profile "test" inherits dev. Dev Services starts one fresh PostGIS container per test JVM, never reused ---
%test.quarkus.config.profile.parent=dev
%test.quarkus.datasource.devservices.reuse=false
# Tests import what they need themselves (ReferenceSeedIT switches it back on)
%test.castor.reference.import-on-start=false
%test.castor.layout.seed-on-start=false
# Not the dev logging: every SQL statement and DEBUG line printed made the test run hundreds of thousands of lines long
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.log.category."com.djavafactory.castor".level=INFO
quarkus.http.test-port=0
quarkus.management.test-port=0
