name: Performance soak

# The full 30 minute orbit of the JOIN-04 memory budget. The CI e2e job leaves it out (it would add minutes to every
# push); run this one by hand before a release. Software WebGL: frame rates are not those of the target laptop (see README "Performance").
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create .env with random secrets
        run: |
          cp .env.example .env
          while grep -q CHANGE_ME .env; do
            sed -i "0,/CHANGE_ME[A-Z_]*/s//$(openssl rand -hex 12)/" .env
          done
      - name: Start the dev stack (fresh data)
        run: |
          eval "$(scripts/build-stamp.sh)"
          export BUILD_VERSION GIT_COMMIT BUILD_TIME
          docker compose --profile dev up -d --build --wait
      - working-directory: frontend
        run: npm ci
      - name: Memory soak
        working-directory: frontend
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          docker run --rm --ipc=host --network host -v "$GITHUB_WORKSPACE":/work -w /work/frontend \
            -e CI -e E2E_BASE_URL="http://localhost:${DEV_WEB_PORT:-8080}" -e PERF_SOAK_MINUTES=30 \
            "mcr.microsoft.com/playwright:v$PW_VERSION-noble" \
            npx playwright test e2e/acceptance/performance.spec.ts -g memory
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-soak
          path: frontend/test-results/performance.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile dev down -v
