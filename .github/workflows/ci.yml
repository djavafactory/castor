name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      # VERSION, backend/pom.xml and frontend/package.json must be equal
      - run: node scripts/check-versions.mjs
      # On a release tag this also fails when the tag differs from VERSION
      - run: scripts/build-stamp.sh

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      # The runner is thrown away after the job: no clean-up container needed
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v5
      # The PostGIS and Kafka images of the integration tests (Dev Services) download while Maven resolves and compiles
      - run: docker pull -q postgis/postgis:18-3.6 > /dev/null 2>&1 &
      - run: docker pull -q apache/kafka:4.2.2 > /dev/null 2>&1 &
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # One Maven run: format check, unit, ArchUnit, Testcontainers integration (fresh PostGIS and Kafka), JaCoCo gates. The
      # runnable app is not packaged here (quarkus.build.skip): the tests do not use it and the e2e job builds the image.
      - run: ./mvnw -B -ntp spotless:check verify -Dquarkus.build.skip=true
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports
            backend/**/target/failsafe-reports
            backend/**/target/site/jacoco*
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      # JOIN-04 budget: the bundle without three under 250 KB gzipped. It is over today (see README "Performance",
      # ticket PERF-01), so it is reported without failing the build; remove continue-on-error when it is fixed.
      - run: npm run bundle:check
        continue-on-error: true
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  # Starts with the other jobs instead of after them: it builds its own images from the source, so waiting for the
  # backend tests only added their minutes to every run
  e2e:
    runs-on: ubuntu-24.04
    # The tests take a few minutes; a hang fails the job instead of running for an hour
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Create .env with random secrets
        run: |
          cp .env.example .env
          while grep -q CHANGE_ME .env; do
            sed -i "0,/CHANGE_ME[A-Z_]*/s//$(openssl rand -hex 12)/" .env
          done
      - name: Start the dev stack (fresh data)
        run: |
          eval "$(scripts/build-stamp.sh)"
          export BUILD_VERSION GIT_COMMIT BUILD_TIME
          docker compose --profile dev up -d --build --wait
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # Runs in the official Playwright image matching the installed version, which has the browser and its libraries.
      - name: Run end-to-end tests
        working-directory: frontend
        run: |
          set -a
          . ../.env
          set +a
          export E2E_USERNAME="$CASTOR_ADMIN_USERNAME" E2E_PASSWORD="$CASTOR_ADMIN_PASSWORD"
          # The gateway answers on the host loopback only (compose publishes 127.0.0.1:DEV_GATEWAY_PORT)
          export E2E_GATEWAY_URL="http://localhost:${DEV_GATEWAY_PORT:-8082}"
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          IMAGE="mcr.microsoft.com/playwright:v$PW_VERSION-noble"
          status=0
          # Mocked specs (login and design system) run against the built app served by Playwright
          docker run --rm --ipc=host -v "$GITHUB_WORKSPACE":/work -w /work/frontend \
            -e CI "$IMAGE" npm run test:e2e || status=1
          # Specs that need the real backend and seed data run against the dev stack
          docker run --rm --ipc=host --network host -v "$GITHUB_WORKSPACE":/work -w /work/frontend \
            -e CI -e E2E_USERNAME -e E2E_PASSWORD -e E2E_GATEWAY_URL -e GATEWAY_DEMO_KEY \
            -e E2E_BASE_URL="http://localhost:${DEV_WEB_PORT:-8080}" \
            -e E2E_API_URL="http://localhost:${DEV_WEB_PORT:-8080}/api" \
            "$IMAGE" npm run test:e2e || status=1
          exit $status
      - name: Compose logs
        if: failure()
        run: docker compose --profile dev logs --no-color
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results/performance.json
          if-no-files-found: ignore
      - if: always()
        run: docker compose --profile dev down -v

  images:
    needs: [versions, backend, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: castor-core
            context: backend
          # The same Dockerfile as castor-core, built for the gateway module
          - image: castor-gateway
            context: backend
            args: |
              MODULE=castor-gateway
              API_PORT=8082
              MANAGEMENT_PORT=9002
          - image: castor-frontend
            context: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Image tags and build stamps
        id: tags
        run: |
          scripts/build-stamp.sh | tee -a "$GITHUB_OUTPUT"
          tags="${{ matrix.image }}:ci"
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tags="$tags"$'\n'"${{ matrix.image }}:${BASH_REMATCH[1]}"
          fi
          {
            echo 'list<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          build-args: |
            BUILD_VERSION=${{ steps.tags.outputs.BUILD_VERSION }}
            GIT_COMMIT=${{ steps.tags.outputs.GIT_COMMIT }}
            BUILD_TIME=${{ steps.tags.outputs.BUILD_TIME }}
            ${{ matrix.args }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
