# castor-core configuration
# Two profiles only. dev: developer machine and every automated test (Dev Services starts PostGIS, nothing to set up).
# prod: every deployed environment, shared dev included; all values come from the environment.
# Required in prod: DB_URL, DB_USERNAME, DB_PASSWORD, DB_FLYWAY_USERNAME, DB_FLYWAY_PASSWORD, CASTOR_CORS_ORIGINS.
# A missing value stops start-up with a message naming the variable. Start locally with: ./mvnw quarkus:dev

quarkus.application.name=castor-core

# --- HTTP ---
quarkus.http.port=8081
# 10 MB is the largest body any endpoint accepts (GeoJSON import); other endpoints are held to 1 MB in BodyLimitFilter
quarkus.http.limits.max-body-size=10M
%prod.quarkus.http.proxy.proxy-address-forwarding=true

# --- CORS: explicit allow-list, never "*" (checked at start-up by CorsOriginsValidator) ---
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS}
%dev.quarkus.http.cors.origins=${CASTOR_CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,If-Match,If-None-Match
quarkus.http.cors.exposed-headers=ETag,Location,X-Request-Id
quarkus.http.cors.access-control-allow-credentials=false

# --- Management interface (health, metrics) ---
quarkus.management.enabled=true
quarkus.management.port=9000

# --- Database ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.metrics.enabled=true
quarkus.datasource.devservices.image-name=postgis/postgis:18-3.6
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Migrations run as castor_flyway, the service as castor_app (db/init/01-roles.sql, docs/2-database-baseline.md).
# dev uses the Dev Services superuser for both.
%prod.quarkus.flyway.username=${DB_FLYWAY_USERNAME}
%prod.quarkus.flyway.password=${DB_FLYWAY_PASSWORD}

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=ref,layout,audit,security

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.statement-batch-size=100
%dev.quarkus.hibernate-orm.log.sql=true

# --- OpenAPI and Swagger UI ---
quarkus.smallrye-openapi.info-title=Castor Core API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
# Keep both on the API port, where the ADMIN rule below applies (not moved to the management port)
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.management.enabled=false
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true

# OpenAPI and Swagger UI need the ADMIN role, except in dev
quarkus.http.auth.policy.admin-only.roles-allowed=ADMIN
quarkus.http.auth.permission.openapi.paths=/q/openapi,/q/openapi/*,/q/swagger-ui,/q/swagger-ui/*
quarkus.http.auth.permission.openapi.policy=admin-only
%dev.quarkus.http.auth.permission.openapi.policy=permit

# --- Logging: plain text in dev, JSON in prod ---
quarkus.log.level=INFO
quarkus.log.category."it.replica8.castor".level=INFO
%dev.quarkus.log.category."it.replica8.castor".level=DEBUG
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service".value=castor-core
%dev.quarkus.log.console.json.enabled=false
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{2.}] (req=%X{requestId} user=%X{username}) %s%e%n

# --- Metrics (served on the management port at /q/metrics) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# --- Tests (run in the dev profile, see the surefire and failsafe settings in pom.xml) ---
quarkus.http.test-port=0
quarkus.management.test-port=0
