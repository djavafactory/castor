# Local profile: database and broker run in Docker (docker compose --profile local up -d --wait), the app on the host.
# The role and its password come from db/init/01-roles.sql. Tests use the dev profile and Dev Services, never this file.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${LOCAL_DB_PORT:5432}/${POSTGRES_DB:castor}
quarkus.datasource.username=${DB_GATEWAY_USERNAME:castor_gateway}
quarkus.datasource.password=${DB_GATEWAY_PASSWORD:castor_gateway_dev}
kafka.bootstrap.servers=localhost:${LOCAL_KAFKA_PORT:9092}
